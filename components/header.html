<!-- SITE HEADER · logo, nav (data-nav), Book Now -->
<header class="site-header">
  <div class="header-inner">
    <div class="flex items-center">
      <a href="/" data-nav="home"
        ><div class="row-24-center">
          <img
            alt="CAG Logo"
            width="130"
            height="35"
            decoding="async"
            data-nimg="1"
            class="h-8 w-auto next-img"
            src="/images/cag-logo.svg"
          />
          <p class="cag-typography cag-l-body cag-black hidden md:block ink-white">
            Off-Airport Check-In
          </p>
        </div></a
      >
    </div>
    <div class="flex items-center">
      <div class="header-nav">
        <p class="cag-typography cag-s-body cag-bold cursor-pointer ink-white" data-nav="faq">
          FAQs
        </p>
        <p class="cag-typography cag-s-body cag-bold cursor-pointer ink-white" data-nav="manage-booking">
          Manage Booking
        </p>
        <div data-nav="book-now" class="header-book-now" style="box-shadow: 0px 1px 2px 0px #1212120d">
          <p class="cag-typography cag-s-body cag-bold ink-black">
            Book Now
          </p>
        </div>
      </div>
      <button aria-label="Open menu" class="block md:hidden">
        <div class="row-8-center">
          <p class="cag-typography cag-s-body cag-bold ink-white">
            Off-Airport Check-In
          </p>
          <img
            alt="Menu"
            loading="lazy"
            width="24"
            height="24"
            decoding="async"
            data-nimg="1"
            class="next-img"
            src="/icons/hamburger.svg"
          />
        </div>
      </button>
    </div>
  </div>
</header>
